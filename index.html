<!DOCTYPE html>
<html lang="en">

<head>
    <title>Havanna House</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            background-image: url('Assets/Smoke Web Banner Desktop (1).jpg');
            height: 100vh;
            width: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: rgb(255, 255, 255);
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav ul li a:hover {
            color: #565657;
        }
    </style>
</head>

<body>

    <div class="hero">
        <nav>
            <ul>
                <li><a href="#home">Cigars</a></li>
                <li><a href="#news">Tobacco</a></li>
                <li><a href="#contact">Accessories</a></li>
                <li><a href="#about">Drinks</a></li>
            </ul>
        </nav>
    </div>

</body>

</html>
